name: LineageOS 23.2 for dew (free runner)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: dew-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04          # 24.04 has broken deps for LOS 23.2
    timeout-minutes: 350           # free runners die at 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true

      - name: Show disk
        run: df -h /

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3

      - name: Configure git + repo
        run: |
          git config --global user.name  "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git lfs install
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Init + sync (retries, shallow)
        run: |
          set -o pipefail
          mkdir -p ~/android/lineage && cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git \
                    -b lineage-23.2 --git-lfs --depth=1
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/.repo/local_manifests/roomservice.xml" \
             .repo/local_manifests/roomservice.xml

          for i in 1 2 3; do
            echo "=== sync attempt $i ==="
            repo sync -c -j4 --force-sync --no-clone-bundle --no-tags \
                      --retry-fetches=5 && break
            echo "sync failed, retrying"; sleep 30
          done
          repo sync -l -c -j4 || true

          echo "=== disk after sync ==="
          df -h / ; du -sh .repo

      # If you still run out of disk, uncomment (breaks `repo` commands, not the build):
      # - name: Reclaim .repo objects
      #   run: rm -rf ~/android/lineage/.repo/project-objects

      - name: Build
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          lunch lineage_dew-userdebug
          export USE_CCACHE=0
          mka bacon -j4 2>&1 | tee build.log
          echo "exit=${PIPESTATUS[0]}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/android/lineage/build.log
          retention-days: 3

      # Artifacts count against the 500 MB quota -> publish a Release instead.
      - name: Publish ROM as Release asset
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ~/android/lineage/out/target/product/dew/lineage-*.zip
          fail_on_unmatched_files: true