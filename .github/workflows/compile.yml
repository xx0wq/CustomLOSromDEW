name: Full LineageOS 23.2 Build Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Free Disk Space Aggressively
        run: |
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /usr/local/share/boost &
          sudo rm -rf /usr/local/share/powershell &
          sudo rm -rf /usr/share/swift &
          sudo rm -rf /usr/local/julia* &
          sudo rm -rf /opt/pipx &
          sudo rm -rf /usr/lib/llvm* &
          sudo rm -rf /usr/local/lib/node_modules &
          sudo apt-get remove -y '^dotnet-*' '^hibule-*' '^llvm-*' '^php*' '^mysql*' '^postgresql*' '^mongodb*' azure-cli google-cloud-cli 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          wait
          echo "Available disk space after aggressive cleanup:"
          df -h

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libncurses-dev libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Source Code & Local Manifests
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --git-lfs
          
          mkdir -p .repo/local_manifests
          if [ -d "$GITHUB_WORKSPACE/.repo/local_manifests" ]; then
            cp -r $GITHUB_WORKSPACE/.repo/local_manifests/* .repo/local_manifests/
          fi

          # Використовуємо --depth=1 для зменшення об'єму завантаження (економить місце на диску)
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags --depth=1

      - name: Setup Ccache Directory & Restore Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.sha }}
            ccache-

      - name: Setup Ccache Environment
        run: |
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=/usr/bin/ccache" >> $GITHUB_ENV
          export CCACHE_DIR=~/.ccache
          ccache -M 20G
          ccache -s

      - name: Compile ROM Output
        run: |
          cd ~/android/lineage
          export CCACHE_DIR=~/.ccache
          source build/envsetup.sh
          lunch lineage_dew-user
          mka bacon -j$(nproc)

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-23.2-Build
          path: |
            ~/android/lineage/out/target/product/dew/*.zip
            ~/android/lineage/out/target/product/dew/boot.img
            ~/android/lineage/out/target/product/dew/recovery.img
